name: Dart CI

on:
  push:
    branches:
      - master

jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
      # // codex: Invoke shared pre-commit test script to keep CI in sync with local hooks.
      - run: .github/workflows/pre-commit.sh
